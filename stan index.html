<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patience Test</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    text-align:center;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

.container{
    max-width:600px;
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
    backdrop-filter:blur(10px);
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:20px;
}

#progress{
    width:100%;
    height:25px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:none;
}

#bar{
    width:0%;
    height:100%;
    background:limegreen;
}

#movingBtn{
    position:fixed;
    display:none;
}
</style>
</head>
<body>

<div class="container">
    <h1>🧘 Patience Test: Legendary Edition</h1>

    <p id="text">
        Do you think you're the most patient person on Earth?
        Let's find out.
    </p>

    <button id="mainBtn" onclick="startTest()">
        Start Test
    </button>

    <div id="progress">
        <div id="bar"></div>
    </div>
</div>

<button id="movingBtn">PASS</button>

<script>

let clicks = 0;

function startTest(){
    document.getElementById("text").innerHTML =
    "Level 1: Click the button 10 times.";
    
    document.getElementById("mainBtn").innerHTML =
    "Click Me (0/10)";
    
    document.getElementById("mainBtn").onclick = level1;
}

function level1(){
    clicks++;

    document.getElementById("mainBtn").innerHTML =
    `Click Me (${clicks}/10)`;

    if(clicks >= 10){
        document.getElementById("text").innerHTML =
        "Great job! Now click it 20 MORE times 😌";

        clicks = 0;
        document.getElementById("mainBtn").onclick = level2;
    }
}

function level2(){
    clicks++;

    document.getElementById("mainBtn").innerHTML =
    `Keep Going (${clicks}/20)`;

    if(clicks >= 20){
        loadingLevel();
    }
}

function loadingLevel(){

    document.getElementById("mainBtn").style.display = "none";

    document.getElementById("text").innerHTML =
    "Please wait... Loading your results.";

    document.getElementById("progress").style.display = "block";

    let width = 0;

    let interval = setInterval(() => {

        width++;

        document.getElementById("bar").style.width =
        width + "%";

        if(width >= 100){

            clearInterval(interval);

            setTimeout(() => {

                document.getElementById("text").innerHTML =
                "Oops. An error occurred.<br><br>Please wait AGAIN. 😂";

                document.getElementById("bar").style.width = "0%";

                secondLoading();

            },1000);
        }

    },100);
}

function secondLoading(){

    let width = 0;

    let interval = setInterval(() => {

        width++;

        document.getElementById("bar").style.width =
        width + "%";

        if(width >= 100){

            clearInterval(interval);

            prankButton();

        }

    },80);
}

function prankButton(){

    document.getElementById("progress").style.display = "none";

    document.getElementById("text").innerHTML =
    "Final Level:<br><br>Click the PASS button.";

    const btn = document.getElementById("movingBtn");

    btn.style.display = "block";

    btn.addEventListener("mouseover", () => {

        btn.style.left =
        Math.random() * (window.innerWidth - 120) + "px";

        btn.style.top =
        Math.random() * (window.innerHeight - 60) + "px";
    });

    btn.onclick = finishTest;
}

function finishTest(){

    document.querySelector(".container").innerHTML = `
        <h1>🏆 TEST COMPLETE</h1>

        <h2>Your Patience Score: 99%</h2>

        <p>
        Congratulations!<br><br>
        You are either extremely patient,
        or way too curious to quit.
        </p>

        <button onclick="location.reload()">
            Take the Test Again
        </button>
    `;

    document.getElementById("movingBtn").style.display = "none";
}

</script>

</body>
</html>
